name: CI

# Aligned with docs/TESTING_AND_RELEASE_PROCESS.md (Phase A): Node 22 (the version the harness and the release gates are
# run on), a frozen lockfile, and the same `pnpm test:all` command a developer runs locally. Job ids are unchanged so any
# branch-protection rule that names them keeps matching.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: Build TEST deployment bundle
        run: bash infra/aws/scripts/build-slice-bundle.sh
      - name: Upload TEST deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: ogevia-test-deployment-bundle
          path: |
            deploy-bundle/*.tgz
            deploy-bundle/*.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  # PostgreSQL job: runs `pnpm test:all` (unit and static tests, infra/aws database tests AND sv-api API tests, all against
  # a real database). test:all fails if any test is skipped or none ran. Same major version as production RDS
  # (PostgreSQL 18). Disposable service container; synthetic fixtures only; no AWS credentials involved.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ogevia_admin
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ogevia_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OGEVIA_TEST_DATABASE_URL: postgres://ogevia_admin@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:all
