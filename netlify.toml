[build]
# Full monorepo gate before publishing - previously this only ran
# @carelik/web's own build step, which happily ships a broken Netlify
# Function as long as the frontend itself compiled (nothing here checked
# apps/netlify-functions at all). turbo fans typecheck/lint/test out to
# every workspace package that declares that script.
command = "pnpm typecheck && pnpm lint && pnpm test && pnpm --filter @carelik/web build"
publish = "apps/web/dist"

[build.environment]
NODE_VERSION = "20"
PNPM_VERSION = "9.15.4"

# Deploy previews must never inherit the production Supabase project. These
# values are browser-safe public credentials for the isolated Ogevia demo.
[context.deploy-preview.environment]
VITE_SUPABASE_URL = "https://ldwhmuirjbwcpzwrwzgv.supabase.co"
VITE_SUPABASE_ANON_KEY = "sb_publishable_ChZMVbL6XTaE78wJ2ft6bg_9JCGIRUV"

[functions]
directory = "apps/netlify-functions/functions"
node_bundler = "esbuild"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
